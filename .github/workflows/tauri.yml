name: Tauri apps

# Separate from ci.yml: a full Tauri build takes several minutes, so it runs
# only when the shell or the UI it bundles changes (plus by hand).
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - apps/tauri/**
      - web/**
      - .github/workflows/tauri.yml
  pull_request:
    paths:
      - apps/tauri/**
      - web/**
      - .github/workflows/tauri.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Windows, NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target
      - name: Sidecars and bundled resources
        shell: pwsh
        run: ./apps/tauri/scripts/prepare.ps1
      - name: Proxy unit tests
        working-directory: apps/tauri/src-tauri
        run: cargo test --lib
      - name: Build installer
        working-directory: apps/tauri
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: typstify-desktop-windows
          path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/tauri/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target
      - name: Android SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" > /dev/null
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Bundled UI
        shell: pwsh
        run: ./apps/tauri/scripts/prepare-mobile.ps1
      - name: Build APK (phones and the x86_64 emulator)
        working-directory: apps/tauri
        run: |
          npm ci
          npx tauri android build --debug --apk --target aarch64 --target x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: typstify-android-debug
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
