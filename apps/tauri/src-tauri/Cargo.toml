[package]
name = "typstify-desktop"
version = "0.1.0"
description = "Typstify desktop: Tauri shell around typstify-server and the web UI"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-single-instance = "=2.5.2"
getrandom = "0.4"
tauri-plugin-opener = "=2.7.0"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
