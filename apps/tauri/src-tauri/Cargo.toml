[package]
name = "typstify-desktop"
version = "0.1.0"
description = "Typstify app: Tauri shell around typstify-server (desktop) or a remote server (mobile)"
edition = "2021"
publish = false

# Mobile builds load the app as a library (tauri::mobile_entry_point).
[lib]
name = "typstify_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
getrandom = "0.4"
tauri-plugin-opener = "=2.7.0"
serde_json = "1"
# Mobile: the local proxy to the self-hosted server (src/proxy.rs).
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }
